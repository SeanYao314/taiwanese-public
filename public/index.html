<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sweat Room</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="app-header">
    <h1>Sweat Room</h1>
    <p class="tagline">Set up a Taiwanese Poker hand, then sweat it out card by card.</p>
  </header>

  <main id="app">

    <!-- ===================== SETUP SCREEN ===================== -->
    <section id="setupScreen" class="screen">

      <div id="preDealPanel" class="panel">
        <h2>1. New hand</h2>

        <div class="field-row">
          <label>Players</label>
          <div class="pill-group" id="playerCountGroup">
            <button type="button" class="pill-btn" data-count="2">2</button>
            <button type="button" class="pill-btn" data-count="3">3</button>
            <button type="button" class="pill-btn" data-count="4">4</button>
          </div>
        </div>

        <div class="field-row" id="playerNamesRow">
          <label>Names</label>
          <div id="playerNameInputs" class="name-inputs"></div>
        </div>

        <div class="field-row">
          <label class="checkbox-row">
            <input type="checkbox" id="homerunToggle">
            <span>Homerun bonus (sweeping all 6 comparisons against an opponent doubles that match's points)</span>
          </label>
        </div>

        <button type="button" id="btnDeal" class="primary-btn">Deal Hands</button>
      </div>

      <div id="arrangePanel" class="panel hidden">
        <h2>2. Arrange every hand</h2>
        <p class="hint">Split each player's 7 cards into a 1-card hand, a 2-card hand, and a 4-card PLO hand. Pick a category below, then tap cards to place or return them.</p>

        <div class="player-tabs" id="playerTabs"></div>

        <div id="arrangerBody"></div>

        <div class="arrange-actions">
          <button type="button" id="btnRedeal" class="ghost-btn">Re-deal</button>
          <button type="button" id="btnSweat" class="primary-btn" disabled>Sweat It Out</button>
        </div>
      </div>

    </section>

    <!-- ===================== SWEAT SCREEN ===================== -->
    <section id="sweatScreen" class="screen hidden">

      <div class="boards-row">
        <div class="board-col">
          <h3 class="board-title" id="boardATitle">Board A</h3>
          <div class="board-cards" id="boardACards"></div>
        </div>
        <div class="board-col">
          <h3 class="board-title" id="boardBTitle">Board B</h3>
          <div class="board-cards" id="boardBCards"></div>
        </div>
      </div>

      <div class="reveal-controls" id="revealControls"></div>

      <div id="outsPanel" class="outs-panel hidden"></div>

      <div class="equity-panel" id="equityPanel"></div>

      <div class="hands-panel" id="handsPanel"></div>

      <div class="sweat-actions">
        <button type="button" id="btnNewHand" class="ghost-btn">New Hand</button>
      </div>

    </section>

  </main>

  <script src="/lib/poker.js"></script>
  <script src="/lib/game.js"></script>
  <script src="/lib/equity.js"></script>
  <script src="/client.js"></script>
</body>
</html>
